version: "3.9"
services:
  prefix:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - API_KEY=change-me
      - REQUEST_LIMIT_PER_MIN=120
      - BODY_LIMIT=2mb
      - CORS_ORIGIN=*
      - METRICS_ENABLED=false
      - FETCH_TIMEOUT_MS=7000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
